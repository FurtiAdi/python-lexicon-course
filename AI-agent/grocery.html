<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery Budget App</title>
</head>
<body>
    <h1>Grocery Budget Tracker</h1>
    <label for="budget">Set Your Budget: </label>
    <input type="number" id="budget" placeholder="Enter budget">
    <button onclick="setBudget()">Set Budget</button>

    <hr>

    <label for="purchase">Add Purchase: </label>
    <input type="text" id="purchase" placeholder="Item name">
    <input type="number" id="amount" placeholder="Amount">
    <button onclick="addPurchase()">Add Purchase</button>

    <h2>Total Spending: $<span id="total">0</span></h2>

    <script>
        let budget = 0;
        let totalSpent = 0;

        function setBudget() {
            budget = parseFloat(document.getElementById('budget').value);
            alert(`Budget set to $${budget}`);
        }

        function addPurchase() {
            const amount = parseFloat(document.getElementById('amount').value);
            if (isNaN(amount)) return;

            totalSpent += amount;
            document.getElementById('total').innerText = totalSpent.toFixed(2);

            if (totalSpent > budget) {
                alert("You have exceeded your budget!");
            }
        }
    </script>
</body>
</html>
