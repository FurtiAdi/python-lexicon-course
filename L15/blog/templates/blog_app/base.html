<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-default navbar-static-top">
      <div class="container">
        <ul class="nav navbar-nav">
          <li><a class="navbar-brand" href="{% url 'index' %}"> Pinch of Habesha</a></li>
          <li><a class="navbar-link" href="{% url 'blog_app:blog' %}">Blog</a></li>
          
          {% if user.is_authenticated %}
           <li><a href="{% url 'blog_app:user_profile' %}">Profile</a></li>
          <li><a class="navbar-link" href="{% url 'logout' %}">Logout</a></li>
          {% else %}
          <li><a class="navbar-link" href="{% url 'blog_app:register' %}">Register</a></li>
          <li><a class="navbar-link" href="{% url 'blog_app:user_login' %}">Login</a></li>
          
         
          {% endif %}
        </ul>
      </div>
    </nav>
    <div class="container">
      {% block body_block %}
      {% endblock %}
  </body>
</html>
