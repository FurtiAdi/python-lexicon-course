{% extends "blog_app/base.html" %} {% block body_block %}
<div class="jumbotron">
  <h2>Login</h2>
  <form action="{% url 'blog_app:user_login' %}" method="post">
    {{ login_form.as_p }} {% csrf_token %}
    <div class="form-group">
      <label for="username">Username</label>
      <input
        type="text"
        name="username"
        id="username"
        class="form-control"
        placeholder="Enter username"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        class="form-control"
        placeholder="Enter password"
      />
    </div>

    <button type="submit" class="btn btn-primary">Login</button>
  </form>
</div>
{% endblock %}
